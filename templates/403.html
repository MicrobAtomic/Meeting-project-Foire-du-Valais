{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Accès réservé" %} · {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="mx-auto max-w-md">
  <div class="card space-y-3 p-8 text-center">
    <div class="text-5xl" aria-hidden="true">🍷</div>
    <h1 class="text-2xl font-semibold">{% translate "Cette porte est réservée" %}</h1>
    <p class="text-stone-600">{% translate "Tu n'as pas accès à cette page." %}</p>
    <a href="{% if user.is_authenticated %}{% url 'club:home' %}{% else %}{% url 'club:landing' %}{% endif %}" class="btn btn-primary">{% translate "Retour à l'accueil" %}</a>
  </div>
</div>
{% endblock %}
